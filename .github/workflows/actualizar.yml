name: Actualizar datos

on:
  schedule:
    - cron: "0 9 * * *"   # todos los días a las 9:00 UTC (6:00 en Chile en horario de verano)
  workflow_dispatch: {}    # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar datos y actualizar la página
        run: node scripts/update.mjs

      - name: Guardar cambios
        run: |
          if git diff --quiet -- index.html; then
            echo "No hay cambios en la página."
          else
            git config user.name "ajedrezchileno-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Actualización automática: $(cat update-summary.txt)"
            git push
          fi

      - name: Avisar si alguna fuente falló
        run: |
          if [ -f update-errors.txt ]; then
            echo "::error::Algunas fuentes no se pudieron actualizar"
            cat update-errors.txt
            exit 1
          fi
